<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Booking confirmation</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <aside>
      <b>LA ĐỎ</b>
      <h1>Tạo phiếu đặt phòng</h1>

      <label>Ngôn ngữ
        <select id="lang">
          <option value="vi">Tiếng Việt</option>
          <option value="en" selected>English</option>
        </select>
      </label>

      <form id="form">
        <label>Tên khách<input name="guest" value="Mar Jo Rie"></label>
        <div class="two">
          <label>Ngày nhận<input name="in" type="date" value="2026-06-03"></label>
          <label>Ngày trả<input name="out" type="date" value="2026-06-04"></label>
        </div>
        <div class="two">
          <label>Giờ nhận<input name="inTime" type="time" value="14:00"></label>
          <label>Giờ trả<input name="outTime" type="time" value="11:00"></label>
        </div>
        <label>Tiền cọc<input name="deposit" type="number" value="975000"></label>
        <label>Dịch vụ<textarea name="services">Ăn sáng buffet
Trà, cà phê và nước uống</textarea></label>
        <label>Chính sách huỷ<input name="policy" value="Không hoàn tiền, không hủy phòng"></label>
      </form>

      <h3 class="room-title">Chi tiết phòng <button id="add" type="button">+ Thêm</button></h3>
      <div id="inputs"></div>

      <div class="actions">
        <button id="png" type="button">Xuất PNG</button>
        <button id="pdf" type="button">Xuất PDF</button>
      </div>
    </aside>

    <section class="preview">
      <article id="page" aria-label="Booking confirmation preview">
        <img class="template-bg" src="assets/booking-confirmation-english.png" alt="English booking confirmation template">
        <div class="overlay" aria-live="polite">
          <span id="greetingGuest" class="overlay-value greeting-guest"></span>

          <span id="guest" class="overlay-value field-guest"></span>
          <span id="nights" class="overlay-value field-nights"></span>
          <span id="checkin" class="overlay-value field-checkin"></span>
          <span id="checkout" class="overlay-value field-checkout"></span>
          <span id="inTime" class="overlay-value field-in-time"></span>
          <span id="outTime" class="overlay-value field-out-time"></span>

          <div id="rows" class="room-rows"></div>

          <span id="total" class="overlay-value summary-total"></span>
          <span id="deposit" class="overlay-value summary-deposit"></span>
          <div id="services" class="overlay-value services-value"></div>
          <span id="policy" class="overlay-value policy-value"></span>
        </div>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
